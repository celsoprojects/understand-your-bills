name: billshare

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: billshare
      POSTGRES_PASSWORD: billshare_dev_password
      POSTGRES_DB: billshare
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billshare -d billshare"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgres://billshare:billshare_dev_password@db:5432/billshare
      - APP_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - COOKIE_SECURE=false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - VITE_API_PROXY_TARGET=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
